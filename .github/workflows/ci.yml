name: CI

# Every change to main arrives through a pull request, so this is what
# guards it: lint, build and test before anything can be merged.
on:
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host crate is a git dependency on a private repository, and cargo's
  # built-in git client cannot use the credential set up below.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `arvo-plugin-host` lives in a private repository, and a workflow's
      # own token only reaches the repository it runs in. Without this
      # secret the build cannot resolve its dependencies at all — see the
      # README for the one-time setup.
      - name: Reach the private host crate
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.ARVO_DESKTOP_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Lint
        run: |
          rustup component add clippy
          cargo clippy --all-targets --locked -- -D warnings

      # Built and tested in release, because release is what ships: this
      # plugin is distributed as a release binary, and a debug-only green
      # tick would not have exercised what a person installs.
      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked
